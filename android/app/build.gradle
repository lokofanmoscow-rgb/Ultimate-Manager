plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ultimatemanager.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ultimatemanager.game'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    signingConfigs {
        release {
            storeFile file('../keystore/ultimate-manager.jks')
            storePassword 'ultimatemanager'
            keyAlias 'ultimatemanager'
            keyPassword 'ultimatemanager'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    aaptOptions {
        noCompress 'json', 'js', 'css', 'html'
    }
}


tasks.matching { it.name.startsWith('lint') }.configureEach { enabled = false }
